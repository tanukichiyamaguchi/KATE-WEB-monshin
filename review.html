<!DOCTYPE html>

    <link rel="stylesheet" href="review-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <img src="assets/logo.png" alt="KATEstageLASH" class="logo">
            <h1 class="salon-name">KATEstageLASH 蒲田西口店</h1>
            <p class="header-subtitle">口コミ投稿</p>
        </header>

        <!-- Thank You Message -->

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

                    <div class="star-rating" data-rating="overall">
                        <input type="hidden" name="rating_overall" value="0">
                        <button type="button" class="star" data-value="1" aria-label="1つ星">

                        </button>

                </div>

                    <label class="rating-label">
                        <span class="rating-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.36 2.72L20.78 4.14L15.06 9.85C16.13 11.39 16.28 13.24 15.38 14.44L9.06 8.12C10.26 7.22 12.11 7.37 13.65 8.44L19.36 2.72M5.93 17.57C3.92 15.56 2.69 13.16 2.35 10.92L7.23 8.83L14.67 16.27L12.58 21.15C10.34 20.81 7.94 19.58 5.93 17.57Z"/></svg>

            <!-- Menu Selection -->
            <section class="form-section">
                <div class="section-header">
                    <h2 class="section-title">本日のメニュー</h2>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="menu" value="まつげパーマ">
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-label">まつげパーマ / パリジェンヌ</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="menu" value="のびるまつげパーマ">
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-label">のびるまつげパーマ（幹細胞）</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="menu" value="アイブロウ">
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-label">アイブロウ / 眉毛wax</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="menu" value="ハリウッドブロウリフト">

            <!-- Generate Review Button -->
            <section class="form-section">
                <button type="button" class="btn btn-generate" id="generateReviewBtn">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3M19 19H5V5H19V19M12 18L6 12H9V6H15V12H18L12 18Z"/></svg>
                    </span>
                    口コミ文を作成する
                </button>
            </section>

            <!-- Review Text Section (Hidden initially) -->
            <section class="form-section review-section" id="reviewSection" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">口コミ文</h2>
                    <p class="section-desc">自由に編集してください</p>
                </div>

                <!-- Loading State -->
                <div class="loading-container" id="reviewLoading" style="display: none;">
                    <div class="loading-spinner-small"></div>
                    <p>口コミ文を作成中...</p>
                </div>

                <!-- Review Textarea -->
                <div class="form-group" id="reviewTextGroup" style="display: none;">
                    <textarea
                        name="review_text"
                        id="reviewText"
                        class="review-textarea"
                        placeholder="口コミ文がここに表示されます..."
                        rows="8"
                    ></textarea>
                    <div class="char-count">
                        <span id="charCount">0</span> 文字
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons" id="actionButtons" style="display: none;">
                    <button type="button" class="btn btn-regenerate" id="regenerateBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4C7.58 4 4.01 7.58 4.01 12S7.58 20 12 20C15.73 20 18.84 17.45 19.73 14H17.65C16.83 16.33 14.61 18 12 18C8.69 18 6 15.31 6 12S8.69 6 12 6C13.66 6 15.14 6.69 16.22 7.78L13 11H20V4L17.65 6.35Z"/></svg>

                    <button type="button" class="btn btn-copy" id="copyBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 21H8V7H19M19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1Z"/></svg>
                        コピー
                    </button>
                </div>

                <!-- Copy Success Message -->

                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 7L9 19L3.5 13.5L4.91 12.09L9 16.17L19.59 5.59L21 7Z"/></svg>
                    コピーしました！
